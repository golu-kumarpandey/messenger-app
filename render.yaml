services:
  - type: web
    name: messenger-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        sync: false

  - type: web
    name: messenger-socket
    runtime: node
    rootDir: sockets
    plan: free
    buildCommand: npm install
    startCommand: npm start

  - type: web
    name: messenger-web
    runtime: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://messenger-api-tgey.onrender.com
      - key: VITE_SOCKET_URL
        value: https://messenger-socket.onrender.com
